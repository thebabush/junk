name: JunkIOS

# The signing team for a device build is this machine's business, not the repo's: it goes in
# Local.xcconfig, which is gitignored. xcodegen refuses to generate against an xcconfig that
# is not there, so the reference lives in Signing.yml and bootstrap.sh includes it only when
# the file exists. Unset — anyone running `xcodegen generate` by hand — reads as false, and
# the project generates unsigned, which is all a simulator build ever needs.
include:
  - path: Signing.yml
    enable: ${JUNK_IOS_LOCAL_XCCONFIG}

options:
  bundleIdPrefix: me.babush.junk
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    # The Rust is built for aarch64-apple-ios and aarch64-apple-ios-sim, so the simulator
    # slice is Apple silicon only; an Intel Mac would need x86_64-apple-ios added to both
    # bootstrap.sh and here.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  JunkIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        # xcodegen has no target-level `bundleId`, only `options.bundleIdPrefix` glued to
        # the target name; the id this app wants is not that, so it is set outright.
        PRODUCT_BUNDLE_IDENTIFIER: me.babush.junk.ios
    sources:
      - path: Sources/JunkIOS
      # uniffi's Swift, built by bootstrap.sh: the whole of what the app knows about a ring.
      - path: Generated/junk_ffi.swift
    dependencies:
      # The Rust, as a static library for the device and the simulator. Static, so nothing
      # to embed; the app is one binary.
      - framework: Generated/JunkFFI.xcframework
        embed: false
      # A Rust staticlib carries no link directives, so what btleplug's CoreBluetooth
      # backend needs is named here.
      - sdk: CoreBluetooth.framework
      - sdk: Foundation.framework
    info:
      path: Generated/Info.plist
      properties:
        CFBundleName: Junk
        CFBundleDisplayName: Junk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - bluetooth-le
        NSBluetoothAlwaysUsageDescription: "Junk talks to your ring over Bluetooth to scan for it, read the days it recorded and stream a workout's heart rate."

schemes:
  JunkIOS:
    build:
      targets:
        JunkIOS: all
