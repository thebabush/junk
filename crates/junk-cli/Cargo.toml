[package]
name = "junk-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The command-line shell of the junk wearable protocol stack: scan for a Colmi ring, sync its logs to CSV, stream a workout, read a Sony WH-1000XM4 over Bluetooth Classic, or replay a captured trace offline"

[[bin]]
name = "junk"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
junk-app = { workspace = true }
junk-ble = { workspace = true }
junk-colmi = { workspace = true }
junk-core = { workspace = true }
junk-pump = { workspace = true }
junk-rfcomm = { workspace = true }
junk-sony = { workspace = true }
junk-trace = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

[lints]
workspace = true
