[package]
name = "junk-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The phone shell of the junk wearable protocol stack: scan, sync and live as a uniffi API, with Rust keeping the Bluetooth and Swift never seeing a frame or a byte"

# `staticlib` for linking into an iOS app, `cdylib` for a simulator or desktop binding, and
# `lib` so the tests and the bindgen binary can use the crate as a crate.
[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
anyhow = { workspace = true }
junk-app = { workspace = true }
junk-ble = { workspace = true }
junk-colmi = { workspace = true }
junk-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
junk-pump = { workspace = true }
junk-trace = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
